# Coolify + Nixpacks. Same method as Mouaser (C:\laragon\www\mouaser):
# the image is built from this file and the container starts with one command.
# This app is Node, so there is no nginx / php-fpm / queue worker.
#
# Node 22 comes from NIXPACKS_NODE_VERSION only. Do not also list nodejs_22 in
# nixPkgs: Nixpacks already installs its default Node 18, and the two packages
# collide on share/doc/node/lldb_commands.py.

[variables]
NIXPACKS_NODE_VERSION = "22"

[phases.setup]
nixPkgs = ["...", "python3", "gcc", "gnumake", "pkg-config"]

[phases.install]
cmds = [
  "bash scripts/coolify-install.sh"
]

[phases.build]
cmds = [
  # Do not run `npm run lint` here. It typechecks UI tests against a client
  # tree that is not the deploy gate, and a test-only error was failing the image.
  "npm run build",
  "chmod +x scripts/start-production.sh",
  "mkdir -p /app/seed /app/data/locks /app/data/backups",
  # Seeds must live outside /app/data. Coolify mounts the persistent volume there,
  # which would hide dahab_local_commerce.json and the server would not boot.
  "cp -a /app/data/. /app/seed/"
]

[start]
cmd = "bash /app/scripts/start-production.sh"
